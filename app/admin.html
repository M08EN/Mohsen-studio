<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>MOHSEN - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #08080a; color: #fff; overflow-x: hidden; min-height: 100vh; }
        #bat-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; position: relative; z-index: 2; }
        header { text-align: center; padding: 20px 0; }
        header h1 { font-weight: 900; letter-spacing: 1px; }
        header h1 span { color: #ff003c; }
        header a { color: #aaa; font-size: 13px; text-decoration: none; display: inline-block; margin-top: 8px; }
        header a:hover { color: #ff003c; }
        .card-box {
            background: rgba(18, 18, 22, 0.9);
            border: 1px solid rgba(255, 0, 60, 0.3);
            padding: 25px; border-radius: 16px; margin: 0 auto 25px; max-width: 650px;
        }
        .card-box h3 { color: #ff003c; margin-bottom: 15px; font-size: 20px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; color: #ddd; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; background: #0d0d10;
            border: 1px solid rgba(255, 0, 60, 0.4); border-radius: 8px;
            color: #fff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #ff003c; box-shadow: 0 0 10px rgba(255, 0, 60, 0.5); }
        .add-btn {
            background: linear-gradient(45deg, #ff003c, #990024); color: #fff; border: none;
            padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.4); transition: 0.3s; width: 100%;
        }
        .add-btn:hover { transform: scale(1.02); }
        .add-btn:disabled { opacity: 0.5; cursor: wait; transform: none; }
        .msg { text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; color: #ff6b8a; }
        .msg.ok { color: #6bff9e; }
        .tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab {
            background: transparent; color: #fff; border: 2px solid #ff003c; padding: 8px 20px;
            border-radius: 30px; font-weight: 700; font-size: 12px; cursor: pointer; text-transform: uppercase;
        }
        .tab.active { background: #ff003c; box-shadow: 0 0 20px rgba(255, 0, 60, 0.8); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .item { background: rgba(20, 20, 25, 0.8); border: 2px solid rgba(255, 0, 60, 0.3); border-radius: 12px; overflow: hidden; }
        .item img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #0d0d10; }
        .item.square img { aspect-ratio: 1 / 1; }
        .item-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; font-size: 13px; font-weight: bold; }
        .item-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .del-btn { background: #2a0b12; color: #ff003c; border: 1px solid #ff003c; border-radius: 6px; padding: 6px 10px; cursor: pointer; flex-shrink: 0; }
        .del-btn:hover { background: #ff003c; color: #fff; }
        .empty { text-align: center; color: #777; padding: 30px; grid-column: 1 / -1; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <canvas id="bat-canvas"></canvas>

    <div class="container">
        <header>
            <h1><span>MOHSEN</span> ADMIN</h1>
            <a href="/"><i class="fas fa-arrow-left"></i> Back to site</a>
        </header>

        <!-- LOGIN -->
        <div id="login-view" class="card-box">
            <h3><i class="fas fa-lock"></i> ADMIN LOGIN</h3>
            <form id="login-form">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="add-btn"><i class="fas fa-sign-in-alt"></i> LOGIN</button>
                <div class="msg" id="login-msg"></div>
            </form>
        </div>

        <!-- DASHBOARD -->
        <div id="admin-view" class="hidden">
            <div class="card-box">
                <h3><i class="fas fa-cloud-upload-alt"></i> UPLOAD NEW IMAGES</h3>
                <form id="upload-form">
                    <div class="form-group">
                        <label>Type</label>
                        <select id="kind">
                            <option value="thumbnail">Thumbnail (16:9)</option>
                            <option value="logo">Logo (square)</option>
                            <option value="site_logo">My site logo (top of the page)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Title (optional)</label>
                        <input type="text" id="title" maxlength="120" placeholder="e.g. Minecraft Crystal PvP">
                    </div>
                    <div class="form-group">
                        <label>Image files (you can pick several)</label>
                        <input type="file" id="files" accept="image/*" multiple required>
                    </div>
                    <button type="submit" class="add-btn" id="upload-btn"><i class="fas fa-upload"></i> UPLOAD</button>
                    <div class="msg" id="upload-msg"></div>
                </form>
            </div>

            <div class="tabs">
                <button class="tab active" data-kind="thumbnail">Thumbnails</button>
                <button class="tab" data-kind="logo">Logos</button>
                <button class="tab" data-kind="site_logo">Site logo</button>
                <button class="tab" id="logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
            <div class="grid" id="items"></div>
        </div>
    </div>

    <script src="bats.js"></script>
    <script>
        const ADMIN_PASS = 'mohsenisdabestboy123';
        const MAX_BYTES = 5 * 1024 * 1024;
        let password = sessionStorage.getItem('adminPassword') || '';
        let works = [];
        let currentKind = 'thumbnail';

        const $ = id => document.getElementById(id);
        const authHeaders = () => ({ 'x-admin-password': password });

        function setMsg(id, text, ok) {
            $(id).textContent = text;
            $(id).classList.toggle('ok', !!ok);
        }

        async function login(pw) {
            return pw === ADMIN_PASS;
        }

        function showAdmin() {
            $('login-view').classList.add('hidden');
            $('admin-view').classList.remove('hidden');
            loadWorks();
        }

        $('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const pw = $('password').value;
            setMsg('login-msg', 'Checking...');
            if (await login(pw)) {
                password = pw;
                sessionStorage.setItem('adminPassword', pw);
                setMsg('login-msg', '');
                showAdmin();
            } else {
                setMsg('login-msg', 'Wrong password');
            }
        });

        $('logout').addEventListener('click', () => {
            sessionStorage.removeItem('adminPassword');
            location.reload();
        });

        async function prepareFile(file) {
            if (file.size <= MAX_BYTES) return file;
            const bitmap = await createImageBitmap(file);
            let scale = Math.min(1, 2560 / bitmap.width);
            for (let quality = 0.9; ; quality -= 0.1) {
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(bitmap.width * scale);
                canvas.height = Math.round(bitmap.height * scale);
                canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
                if (blob.size <= MAX_BYTES || quality < 0.4) return blob;
                if (quality < 0.6) scale *= 0.75;
            }
        }

        $('upload-form').addEventListener('submit', async e => {
            e.preventDefault();
            const files = [...$('files').files];
            const kind = $('kind').value;
            const title = $('title').value.trim();
            if (!files.length) return;

            $('upload-btn').disabled = true;
            let done = 0;
            try {
                for (const file of files) {
                    setMsg('upload-msg', `Uploading ${done + 1} of ${files.length}...`);
                    const body = await prepareFile(file);
                    const params = new URLSearchParams({ kind, title });
                    const res = await fetch('/api/works?' + params, {
                        method: 'POST',
                        headers: { ...authHeaders(), 'Content-Type': body.type || 'image/jpeg' },
                        body
                    });
                    if (!res.ok) {
                        const data = await res.json().catch(() => ({}));
                        throw new Error(data.error || 'Upload failed');
                    }
                    done++;
                }
                setMsg('upload-msg', `✅ Uploaded ${done} image${done > 1 ? 's' : ''}. They're live on the site now.`, true);
                $('upload-form').reset();
                $('kind').value = kind;
                selectTab(kind);
            } catch (err) {
                setMsg('upload-msg', `❌ ${err.message} (${done} uploaded)`);
            } finally {
                $('upload-btn').disabled = false;
                loadWorks();
            }
        });

        async function loadWorks() {
            const res = await fetch('/api/works');
            works = res.ok ? await res.json() : [];
            renderItems();
        }

        function renderItems() {
            const container = $('items');
            container.replaceChildren();
            const items = works.filter(w => w.kind === currentKind);
            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = 'Nothing here yet. Upload some images above.';
                container.append(empty);
                return;
            }
            items.forEach((work, i) => {
                const item = document.createElement('div');
                item.className = 'item' + (work.kind === 'thumbnail' ? '' : ' square');

                const img = document.createElement('img');
                img.src = `/.netlify/images?url=/api/images/${work.id}&w=500&fm=webp`;
                img.onerror = () => { img.onerror = null; img.src = `/api/images/${work.id}`; };
                img.loading = 'lazy';

                const bar = document.createElement('div');
                bar.className = 'item-bar';
                const label = document.createElement('span');
                label.textContent = work.title || (work.kind === 'site_logo' && i === 0 ? 'Current logo' : 'Untitled');
                const del = document.createElement('button');
                del.className = 'del-btn';
                del.title = 'Delete';
                del.innerHTML = '<i class="fas fa-trash"></i>';
                del.onclick = () => deleteWork(work);
                bar.append(label, del);

                item.append(img, bar);
                container.append(item);
            });
        }

        async function deleteWork(work) {
            if (!confirm('Delete this image from the site?')) return;
            const res = await fetch(`/api/works/${work.id}`, { method: 'DELETE', headers: authHeaders() });
            if (!res.ok) alert('Could not delete. Try logging in again.');
            loadWorks();
        }

        function selectTab(kind) {
            currentKind = kind;
            document.querySelectorAll('.tab[data-kind]').forEach(t => t.classList.toggle('active', t.dataset.kind === kind));
            renderItems();
        }
        document.querySelectorAll('.tab[data-kind]').forEach(t => t.addEventListener('click', () => selectTab(t.dataset.kind)));

        if (password) {
            login(password).then(ok => ok ? showAdmin() : sessionStorage.removeItem('adminPassword'));
        }
    </script>
</body>
</html>
